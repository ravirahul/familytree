name: CI

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, gd, zip, curl
          ini-values: zend.assertions=1, assert.exception=1
          coverage: none

      - name: Lint PHP
        run: find . -name '*.php' -not -path './public_html/admin/uploads/*' -not -path './desktop/php/*' -print0 | xargs -0 -n1 -P4 php -l 

      - name: Unit tests
        run: |
          for t in tools/test-*.php; do
            echo "== $t"
            php -d zend.assertions=1 -d assert.exception=1 "$t"
          done

      - name: Smoke test (SQLite install, built-in server)
        run: php tools/smoke.php

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check JS
        run: find public_html -name '*.js' -not -name '*.min.js' -not -path '*/vendor/*' -not -path 'public_html/admin/uploads/*' -print0 | xargs -0 -n1 node --check

      - name: Node tests
        run: |
          shopt -s nullglob
          for t in tools/test-*.mjs; do
            echo "== $t"
            node "$t"
          done
